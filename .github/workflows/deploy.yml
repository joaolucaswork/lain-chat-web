name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

# Deploys em série (single-instance): nunca dois ao mesmo tempo.
concurrency:
  group: deploy-lain-chat-web
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, lain-chat-web]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      # bun run (não bun test): o script inclui --preload do env de teste.
      - run: bun run test

  deploy:
    needs: verify
    runs-on: [self-hosted, lain-chat-web]
    steps:
      - run: /opt/deploy/lain-chat-web.sh
